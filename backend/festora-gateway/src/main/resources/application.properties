
spring.application.name=festora-gateway
server.port=8080
server.address=127.0.0.1
spring.config.import=optional:file:.env[.properties]

spring.cloud.gateway.server.webflux.routes[0].id=festora-backend
spring.cloud.gateway.server.webflux.routes[0].uri=${FESTORA_BACKEND_URL}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**

spring.cloud.gateway.server.webflux.routes[1].id=festora-uploads
spring.cloud.gateway.server.webflux.routes[1].uri=${FESTORA_BACKEND_URL}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/uploads/**

festora.jwt.secret=${JWT_SECRET}
festora.jwt.expiration=3600000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
