spring.application.name=festora-backend

server.port=8081
server.address=127.0.0.1
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/festora_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.threads.virtual.enabled=true

festora.jwt.secret=${JWT_SECRET}
festora.jwt.expiration=3600000

festora.storage.avatar-directory=${AVATAR_DIRECTORY:./uploads/avatars}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
spring.messages.basename=messages
spring.messages.encoding=UTF-8
festora.billing.base-url=${FESTORA_BILLING_BASE_URL:http://localhost:8091}
festora.billing.refund-path=${FESTORA_BILLING_REFUND_PATH:/api/refunds}
festora.billing.internal-api-key=${BILLING_INTERNAL_API_KEY}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.level.root=INFO
logging.level.com.festora_backend=INFO
logging.file.name=logs/festora-backend.log
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
festora.frontend.url=${FESTORA_FRONTEND_URL:http://localhost:5173}
festora.password-reset.expiration-minutes=15
festora.jwt.refresh-expiration-days=${FESTORA_REFRESH_EXPIRATION_DAYS:30}