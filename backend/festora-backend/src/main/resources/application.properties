spring.application.name=festora-backend

server.port=8081
server.address=127.0.0.1
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/festora_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.threads.virtual.enabled=true

festora.jwt.secret=${JWT_SECRET}
festora.jwt.expiration=3600000

festora.storage.avatar-directory=${AVATAR_DIRECTORY:./uploads/avatars}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
spring.messages.basename=messages
spring.messages.encoding=UTF-8

festora.booking.expiry-cron=0 * * * * *