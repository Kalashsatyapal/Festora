
spring.config.import=optional:file:.env[.properties]
spring.application.name=festora-billing-service
server.port=8091
server.address=127.0.0.1

spring.datasource.url=${BILLING_DB_URL}
spring.datasource.username=${BILLING_DB_USERNAME}
spring.datasource.password=${BILLING_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

festora.billing.internal-api-key=${BILLING_INTERNAL_API_KEY}

management.endpoints.web.exposure.include=health,info
